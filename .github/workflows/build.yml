# Compila o Strato (APK "mainline" release) no GitHub Actions.
# Dispara a cada push em main/master e também manualmente (aba Actions > Build > Run workflow).
name: Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 3G

jobs:
  build:
    runs-on: ubuntu-24.04 # Fixo: o rótulo ubuntu-latest migra para o Ubuntu 26 em 19/10/2026
    timeout-minutes: 300
    steps:
      - name: Git Checkout
        uses: actions/checkout@v5
        # As bibliotecas (app/libraries) já estão dentro do repositório,
        # então NÃO usamos "submodules: recursive".

      - name: Restore symlinks (perdidos ao copiar o projeto pelo armazenamento do Android)
        run: |
          cd app/libraries
          rm -f audio-core/include/audio_core audio-core/include/core shader-compiler/include/shader_compiler
          ln -s ..     audio-core/include/audio_core
          ln -s ../core audio-core/include/core
          ln -s ..     shader-compiler/include/shader_compiler
          ls -la audio-core/include shader-compiler/include

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Install ccache
        run: sudo apt-get install -y ccache

      # actions/cache restore/save em passos separados: o cache do ccache é salvo mesmo quando o build falha, assim a próxima tentativa não recompila tudo
      - name: Restore CCache
        uses: actions/cache/restore@v5
        with:
          path: /home/runner/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Restore Gradle Cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle') }}-${{ hashFiles('app/**/*.xml') }}-${{ hashFiles('app/**.kt', 'app/**.java') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle') }}-${{ hashFiles('app/**/*.xml') }}-
            ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle') }}-
            ${{ runner.os }}-gradle-

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Ninja Build
        run: |
          sudo apt-get install -y ninja-build
          ln -sf /usr/bin/ninja .

      - name: Install NDK 27.2.12479018 and CMake 3.22.1
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018" "cmake;3.22.1" || echo "sdkmanager falhou; o Gradle tentará baixar sozinho"

      - name: Android Assemble
        env:
          CMAKE_C_COMPILER_LAUNCHER: "ccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "ccache"
          CCACHE_COMPILERCHECK: "string:27.2.12479018"
        run: ./gradlew --no-daemon --stacktrace --build-cache --parallel --configure-on-demand assembleMainlineRelease

      - name: Show CCache statistics
        if: always()
        run: ccache -s || true

      - name: Save CCache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: /home/runner/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: strato-mainline-release
          path: app/build/outputs/apk/mainline/release/*.apk
          if-no-files-found: error
